server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8718
    gateway:
      discovery:
        locator:
          enabled: true           # 开启服务发现路由
          lower-case-service-id: true
      routes:
        # 用户服务
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 商品服务
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        # 订单服务
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # 购物车服务 (聚合至 order-service)
        - id: cart-service
          uri: lb://order-service
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1

        # AI 服务
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

        # 知识库服务
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=1

        # 支付中台服务
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/pay/**
          filters:
            - StripPrefix=1

      # 全局跨域
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true

# JWT
jwt:
  secret: ${JWT_SECRET:aimall-platform-secret-key-must-be-32-bytes!}
  expiration: 86400000

# 日志
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level){highlight} %clr([%X{traceId:-}]){cyan} %clr([%15.15thread]){faint} %clr(%logger{36}){blue} - %msg%n"
  level:
    com.aimall: INFO
    com.alibaba.nacos: WARN
    org.springframework.cloud.gateway: WARN
